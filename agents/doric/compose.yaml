name: doric-sandbox

services:
  firecracker:
    profiles: [firecracker]
    build:
      context: ../..
      dockerfile: agents/doric/.Dockerfile
    environment:
      DORIC_SANDBOX_PROVIDER: firecracker
    network_mode: host
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - firecracker-state:/var/lib/doric/firecracker
      - firecracker-cache:/var/cache/doric/firecracker

  docker:
    profiles: [docker]
    build:
      context: ../..
      dockerfile: agents/doric/.Dockerfile
    environment:
      DORIC_SANDBOX_PROVIDER: docker
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  firecracker-state:
  firecracker-cache:
