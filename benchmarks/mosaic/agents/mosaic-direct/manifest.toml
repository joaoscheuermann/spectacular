contract_version = "1.0"
name = "mosaic-direct"
description = "Mosaic benchmark ACP agent."
protocol = "acp"
api_protocol = "openai-completions"
install_cmd = '''set -eu
BF_NODE_DIR=/opt/benchflow/node
BF_NODE_VERSION=22.20.0
BF_MOSAIC_DIR=/opt/benchflow/mosaic
BF_RELEASE=mosaic-benchmark-v0.1.13
BF_BUNDLE_SHA256=31242530617316290a2a5b807c0c4c5dd6f0905d3b1bdddf74c393d952387198
if ! command -v curl >/dev/null 2>&1 || ! command -v tar >/dev/null 2>&1 || ! command -v xz >/dev/null 2>&1 || ! command -v sha256sum >/dev/null 2>&1; then
  if command -v apt-get >/dev/null 2>&1; then
    apt-get update -qq
    apt-get install -y -qq curl ca-certificates coreutils tar xz-utils
  elif command -v dnf >/dev/null 2>&1; then
    dnf -y install curl ca-certificates coreutils tar xz
  elif command -v apk >/dev/null 2>&1; then
    apk add --no-cache curl ca-certificates coreutils tar xz
  else
    echo 'BenchFlow Mosaic bootstrap requires curl, sha256sum, tar, and xz.' >&2
    exit 127
  fi
fi
needs_node=0
if [ ! -x "$BF_NODE_DIR/bin/node" ]; then
  needs_node=1
elif [ "$("$BF_NODE_DIR/bin/node" --version)" != "v$BF_NODE_VERSION" ]; then
  needs_node=1
fi
if [ "$needs_node" -eq 1 ]; then
  case "$(uname -m)" in
    x86_64|amd64) node_arch=x64; node_sha256=00bbd05e306ea68b6e13e17360d0e2f680b493ef95f2fea1c4296ff7437530bc ;;
    aarch64|arm64) node_arch=arm64; node_sha256=06907b9c088ce62305bc1530e5c1ae1510245114645768f7750c349c5b6fe667 ;;
    *) echo "Unsupported architecture for Node.js: $(uname -m)" >&2; exit 1 ;;
  esac
  tmp=$(mktemp -d)
  curl -fsSLo "$tmp/node.tar.xz" "https://nodejs.org/dist/v$BF_NODE_VERSION/node-v$BF_NODE_VERSION-linux-$node_arch.tar.xz"
  printf '%s  %s\n' "$node_sha256" "$tmp/node.tar.xz" | sha256sum -c -
  rm -rf "$BF_NODE_DIR"
  mkdir -p "$BF_NODE_DIR"
  tar -xJf "$tmp/node.tar.xz" -C "$BF_NODE_DIR" --strip-components=1 --no-same-owner
  rm -rf "$tmp"
fi
mkdir -p "$BF_MOSAIC_DIR"
installed_checksum=''
if [ -f "$BF_MOSAIC_DIR/mosaic-bench-acp.mjs.sha256" ]; then
  read -r installed_checksum _ < "$BF_MOSAIC_DIR/mosaic-bench-acp.mjs.sha256"
fi
if [ ! -f "$BF_MOSAIC_DIR/mosaic-bench-acp.mjs" ] || [ "$installed_checksum" != "$BF_BUNDLE_SHA256" ] || ! (cd "$BF_MOSAIC_DIR" && sha256sum -c mosaic-bench-acp.mjs.sha256); then
  tmp=$(mktemp -d)
  url="https://github.com/joaoscheuermann/spectacular/releases/download/$BF_RELEASE"
  curl -fsSL -o "$tmp/mosaic-bench-acp.mjs" "$url/mosaic-bench-acp.mjs"
  curl -fsSL -o "$tmp/mosaic-bench-acp.mjs.sha256" "$url/mosaic-bench-acp.mjs.sha256"
  read -r downloaded_checksum _ < "$tmp/mosaic-bench-acp.mjs.sha256"
  if [ "$downloaded_checksum" != "$BF_BUNDLE_SHA256" ]; then
    echo 'Published MOSAIC bundle does not match the manifest checksum.' >&2
    exit 1
  fi
  (cd "$tmp" && sha256sum -c mosaic-bench-acp.mjs.sha256)
  mv "$tmp/mosaic-bench-acp.mjs" "$BF_MOSAIC_DIR/mosaic-bench-acp.mjs"
  mv "$tmp/mosaic-bench-acp.mjs.sha256" "$BF_MOSAIC_DIR/mosaic-bench-acp.mjs.sha256"
  rmdir "$tmp"
fi
"$BF_NODE_DIR/bin/node" --version
'''
launch_cmd = '''set -eu
umask 077
key_file=$(mktemp)
cleanup() { rm -f "$key_file"; }
trap cleanup 0 HUP INT TERM
printf '%s' "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}" > "$key_file"
chmod 600 "$key_file"
unset OPENROUTER_API_KEY BENCHFLOW_PROVIDER_API_KEY BENCHFLOW_LITELLM_MASTER_KEY
export OPENROUTER_API_KEY_FILE="$key_file"
exec /opt/benchflow/node/bin/node /opt/benchflow/mosaic/mosaic-bench-acp.mjs serve direct'''
supports_acp_set_model = false
default_model = "openrouter/openai/gpt-5.6-luna"
skill_paths = ["$HOME/.agents/skills"]
home_dirs = [".agents"]

[env_mapping]
BENCHFLOW_PROVIDER_BASE_URL = "OPENROUTER_BASE_URL"
BENCHFLOW_PROVIDER_API_KEY = "OPENROUTER_API_KEY"
BENCHFLOW_PROVIDER_MODEL = "OPENROUTER_MODEL"
