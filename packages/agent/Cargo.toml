[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonschema = { version = "0.46.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
llms = { path = "../llms" }
tiktoken = "3.1.4"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
futures = "0.3.31"
