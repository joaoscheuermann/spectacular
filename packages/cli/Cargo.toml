[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "doric"
path = "src/main.rs"

[dependencies]
anstyle = "1.0.14"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.49", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["bracketed-paste"] }
iocraft = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
agent = { path = "../agent" }
commands = { path = "../commands" }
config = { path = "../config" }
llms = { path = "../llms" }
tools = { path = "../tools" }
tui = { path = "../tui" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
unicode-width = "0.1.14"
