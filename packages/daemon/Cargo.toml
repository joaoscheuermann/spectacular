[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "doric-daemon"
path = "src/main.rs"

[dependencies]
config = { path = "../config" }
lifecycle = { path = "../lifecycle" }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.6"
