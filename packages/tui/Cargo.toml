[package]
name = "tui"
version = "0.1.0"
edition = "2021"

[dependencies]
anstyle = "1.0.14"
arboard = "3.6.1"
iocraft = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
commands = { path = "../commands" }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.1.14"

[dev-dependencies]
crossterm = "0.29.0"
futures = "0.3.30"
serde_json = "1.0.145"
